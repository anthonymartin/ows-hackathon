apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ows-studio-ingress
  namespace: ows-studio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ows-studio.memrail.com
      secretName: ows-studio-tls
  rules:
    - host: ows-studio.memrail.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ows-studio-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ows-studio-frontend
                port:
                  number: 3000
