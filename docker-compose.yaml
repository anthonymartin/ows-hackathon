services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - CORS_ORIGINS=http://localhost:3000
      - MEMRAIL_BASE_URL=${MEMRAIL_BASE_URL:-https://api.memrail.com}
      - MEMRAIL_ORG=${MEMRAIL_ORG:-ows}
      - MEMRAIL_TEAM=${MEMRAIL_TEAM:-default}
      - MEMRAIL_ADMIN_API_KEY=${MEMRAIL_ADMIN_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
    volumes:
      - ./backend/app:/app/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8080
    depends_on:
      - api
